[runtime]
host = "127.0.0.1"
port = 8765

[storage]
kind = "sqlite"
journal_mode = "wal"
foreign_keys = true
busy_timeout_ms = 5000

[privacy]
cloud_egress = "ask"

[llm]
provider = "demo"
model = "chatwaifu-demo"
base_url = "http://127.0.0.1:11434/v1"
timeout_seconds = 60

[tts]
default_provider = "qwen3_tts_mlx"
voice = "Tingting"
sample_rate = 24000
rate = 190
timeout_seconds = 180
worker_url = "http://127.0.0.1:8767"

[tts.workers.qwen3_tts_mlx]
url = "http://127.0.0.1:8767"
display_name = "Qwen3-TTS · MLX"
model = "Qwen3-TTS-12Hz-0.6B-Base-8bit"
languages = ["zh", "ja", "en"]
supports_voice_cloning = true
supports_style = false
supports_speed = true
supports_pitch = false
native_streaming = true

[tts.workers.gpt_sovits]
url = "http://127.0.0.1:8768"
display_name = "GPT-SoVITS"
model = "local-character-voice"
languages = ["zh", "ja", "en"]
supports_voice_cloning = true
supports_style = false
supports_speed = true
supports_pitch = false
native_streaming = true

[realtime]
enabled = true
input_sample_rate = 16000
output_sample_rate = 24000
vad_confidence = 0.7
vad_start_ms = 160
vad_stop_ms = 650
pre_roll_ms = 320
max_utterance_seconds = 30
echo_enabled = false

[stt]
provider = "disabled"
worker_url = "http://127.0.0.1:8766"
language = "zh"
timeout_seconds = 60
