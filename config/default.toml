[runtime]
host = "127.0.0.1"
port = 8765

[storage]
kind = "sqlite"
journal_mode = "wal"
foreign_keys = true
busy_timeout_ms = 5000

[privacy]
cloud_egress = "ask"

[llm]
provider = "demo"
model = "chatwaifu-demo"
base_url = "http://127.0.0.1:11434/v1"
timeout_seconds = 60

[tts]
provider = "auto"
voice = "Tingting"
sample_rate = 24000
rate = 190
timeout_seconds = 30

[realtime]
enabled = true
input_sample_rate = 16000
output_sample_rate = 24000
vad_confidence = 0.7
vad_start_ms = 160
vad_stop_ms = 650
pre_roll_ms = 320
max_utterance_seconds = 30
echo_enabled = false
