[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatwaifu-runtime"
version = "0.1.0"
description = "Local-first ChatWaifu NEXT application runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "anyio>=4.10,<5",
  "chatwaifu-model-worker-sdk",
  "chatwaifu-protocol",
  "fastapi>=0.116,<1",
  "httpx2>=2.12,<3",
  "jsonschema>=4.25,<5",
  "pydantic-settings>=2.10,<3",
  "pipecat-ai[webrtc]==1.7.0",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0.2,<7",
  "structlog>=25,<27",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=17,<18",
]

[project.scripts]
chatwaifu-runtime = "chatwaifu_runtime.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/chatwaifu_runtime"]

[tool.uv.sources]
chatwaifu-model-worker-sdk = { workspace = true }
chatwaifu-protocol = { workspace = true }

[dependency-groups]
dev = []
