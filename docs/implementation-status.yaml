      - The 0.6B pilot checkpoint converts to an 8-bit MLX CustomVoice model with the fixed ayachi_nene_local speaker and completes real Chinese/Japanese synthesis on Apple Silicon
  - id: 10
    name: runtime-skills-and-plugins
    status: basic_permissioned_mcp_slice_implemented_pending_os_sandbox
    evidence:
      - SKILL.md and chatwaifu.yaml discovery validates ids, versions, schemas, paths, and duplicates
      - SQLite persists plugins, runs, permission requests, grants, and audited tool calls
      - Permission grants remain separate from per-invocation side-effect confirmation
      - MCP 2025-11-25 stdio tools run in fresh Python child processes with cleaned environments
      - Input/output schema validation, normalized errors, timeout, cancellation, and restart expiry pass tests
      - Local Echo example covers read, confirmed write, timeout, cancellation, disable, and recoverable uninstall
      - Web control center provides progressive SKILL.md loading, invocation, confirmation, run, and plugin controls
      - Real browser smoke completed MCP echo and denied a pending write without executing it
  - id: 11
    name: structured-memory-kernel
    status: scheme_a_plus_rebuildable_b_projection_implemented_c_reserved_pending_longmem_eval
    evidence:
      - SQLite WAL stores typed records, sources, proposals, lifecycle states, pinned state, and an FTS5 projection
      - Explicit normal writes commit immediately; implicit candidates require review; sensitive candidates always require confirmation
      - Deterministic extraction, exact dedupe, subject-predicate conflict detection, supersede, and provenance are covered by tests
      - User-initiated conversation topics become reviewable episodic observations without being promoted to stable preferences, and repeated topic choices deduplicate
      - Retrieval applies namespace, state, sensitivity, lexical, importance, confidence, and token-budget policy before prompt injection
      - The Web memory center reviews proposals and exposes filters, sources, correction, pinning, and auditable forgetting
      - SQLiteSemanticMemoryIndex activates a rebuildable Scheme B candidate projection while the Scheme C temporal port remains reserved without changing SQLite truth ownership
  - id: 12
    name: character-kernel-and-model-routing
    status: implemented_local_vertical_slice_pending_longmem_and_cross_model_eval
    evidence:
      - The default character loads from validated character, persona, voice, avatar, relationship-policy, and lexicon package files with JSON fallback
      - SQLite persists bounded Affect and Relationship state across sessions; reset restores policy defaults
      - User turns, elapsed-time decay, and Runtime-acknowledged avatar touch pass deterministic reducers with clamped deltas
      - A semantic ResponsePlan drives only avatar capabilities declared by the character manifest and suppresses repeated motions
      - Prompt Compiler preserves safety and canon while budgeting state, relationship, memory, scene, and conversation context
      - Chat, memory extraction, memory summary, and embedding roles are independently persisted, updated, and probed through Web
      - API keys are write-only to a mode-0600 Runtime file and are never returned to or persisted by Web
      - Strict model-assisted memory extraction still passes policy, review, dedupe, contradiction, privacy, and provenance gates
      - A fingerprinted SQLite semantic projection is rebuilt on embedding-route changes while WAL plus FTS5 remains truth
      - Host-only OpenAI-compatible URLs default to /v1 while explicit and nested API base paths remain unchanged
      - Shared-event extraction requires completed playback acknowledgement and assistant spoken-text evidence

