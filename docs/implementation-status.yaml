    name: runtime-core
    status: basic_demo_implemented_pending_remote_ci
    evidence:
      - FastAPI loopback Runtime exposes health, session, event, audio, character, memory, and skill APIs
      - SQLite WAL migrations persist sessions, turns, generations, outbox events, memory, and FTS5
      - Demo and OpenAI-compatible LLM providers share a cancellation-aware streaming contract
      - Session-scoped TtsRouter selects normalized Qwen or GPT-SoVITS workers while macOS say and fake remain test/fallback paths
      - Browser WebSocket renders lossless text deltas, queues generation-scoped audio, and applies AvatarCue
      - Browser event subscriptions use a durable per-session sequence cursor, atomic recovery snapshot, paged replay, gap repair, and de-duplication across startup, overflow, and reconnect
      - Audio-element playback promotes a hanging user-gesture probe as soon as real TTS arrives so WKWebView cannot leave active-generation segments queued forever
      - A bounded adaptive Web projector smooths network/provider text bursts without delaying Runtime or leaking cancelled-generation text
      - The fixed character greeting is limited to truly empty conversations and is not reused as pending-generation text
      - Interrupt cancels Runtime work and clears stale browser playback and avatar state
      - Runtime persists idempotent segment playback acknowledgements and projects only completely heard sentences into generation spoken_text
      - Structured memory records survive sessions, keep source-event provenance, and forget uses auditable tombstones
      - Confirmed reset quarantines owned WAVs, atomically clears current-session turns/events plus current character/user memory and relationship truth, restores audio on transaction failure, and preserves unrelated scopes
      - Desktop settings discloses that scoped reset boundary before deletion and requires a second typed confirmation while explicitly preserving model routes, API keys, plugins, MCP, channels, and unrelated scopes
      - Reset keeps the session ready, rejects late output, and resumes from a collision-free event sequence while retaining any cross-scope provenance event that must remain auditable
      - SQLite migrations apply script plus checksummed ledger entry atomically, reject edited or newer versions, and recover cleanly after injected failure
      - Runtime startup rolls back every successfully started component on failure; shutdown aggregates cleanup errors, continues teardown, and retries only failed steps
      - Conversation orchestration depends on a persistence port and a dedicated generation-scoped speech pipeline instead of issuing SQL or owning PCM/playback details
      - Manifest-driven runtime.status skill reports actual providers with read-only side effect
