    name: interruption-and-generation-semantics
    status: implemented_with_segment_playback_ack_pending_long_run
    evidence:
      - Speech start pushes Pipecat interruption before cancelling the active conversation generation
      - STT jobs and Runtime generations carry session, turn, and generation identity
      - Superseded STT results and stale Runtime audio are rejected before playback
