phases:
  - id: 0
    name: repository-foundation
    status: implemented_pending_ci
    evidence:
      - Python, TypeScript, and Rust lockfiles exist
      - Six GitHub Actions workflows are configured
      - Fourteen ADRs exist; ADR 0014 supersedes the default-TTS decision in ADR 0012
      - Seven project Codex Development Skills pass quick validation
      - Local bootstrap, lint, typecheck, test, and build gates pass
  - id: 1
    name: protocol-and-code-generation
    status: implemented_pending_ci
    evidence:
      - Pydantic protocol source covers all required Phase 1 model families
      - 28 versioned JSON Schemas are generated deterministically
      - Generated TypeScript declarations and Zod runtime parsers are present
      - 13 Python tests and 7 TypeScript contract tests pass
      - Python-to-TypeScript and TypeScript-to-Python golden fixtures pass
      - Unknown major versions, unknown types, and invalid payloads are rejected
      - Same-major optional fields are accepted
      - Audio control headers round-trip as bounded UTF-8 bytes
  - id: 2
    name: live2d-avatar-lab
    status: implemented_real_local_path_pending_remote_ci
    evidence:
      - AvatarCue is reduced through a bounded layered scheduler into an AvatarRenderer
      - AvatarController owns the requestAnimationFrame loop outside React state
      - FakeAvatarRenderer supports semantic state, expression, gesture, gaze, lipsync, and hit tests
      - 17 Avatar SDK tests cover scheduling, lifecycle, bridge mapping, fallback, and missing Core
      - 50 consecutive Fake renderer load and unload cycles leave zero resources
      - 5 Chromium Playwright scenarios cover cues, vendor failure, viewport scrolling, real Avatar Lab, and real main chat
      - Official Cubism Web Framework 5-r.5 is pinned and fetched idempotently
      - The local-only Ayachi Nene model loads through the generated bridge with semantic facial presets and bounded action motions
      - Main chat selects real Live2D and safely remounts Fake when vendor loading fails
      - Desktop chat remains bounded to the viewport while only the transcript scrolls
      - Production Web build succeeds without Runtime, Tauri, Pipecat, or proprietary vendor files
  - id: 3
    name: tauri-desktop-host
    status: deferred_non_blocking_for_web_demo
  - id: 4
    name: runtime-core
    status: basic_demo_implemented_pending_remote_ci
    evidence:
      - FastAPI loopback Runtime exposes health, session, event, audio, character, memory, and skill APIs
      - SQLite WAL migrations persist sessions, turns, generations, outbox events, memory, and FTS5
      - Demo and OpenAI-compatible LLM providers share a cancellation-aware streaming contract
      - Session-scoped TtsRouter selects normalized Qwen or GPT-SoVITS workers while macOS say and fake remain test/fallback paths
      - Browser WebSocket renders lossless text deltas, queues generation-scoped audio, and applies AvatarCue
      - A bounded adaptive Web projector smooths network/provider text bursts without delaying Runtime or leaking cancelled-generation text
      - Interrupt cancels Runtime work and clears stale browser playback and avatar state
      - Structured memory records survive sessions, keep source-event provenance, and forget uses auditable tombstones
      - Confirmed reset cancels generation and clears current turns/events, all memories, and WAV assets
      - Reset keeps the session ready and rejects late output before a fresh sequence starts at one
      - Manifest-driven runtime.status skill reports actual providers with read-only side effect
      - make demo supervises Runtime and Web and leaves both loopback ports closed after Ctrl+C
  - id: 5
    name: pipecat-realtime-transport
    status: basic_web_voice_path_implemented_pending_hardening
    evidence:
      - Pipecat 1.7 is pinned behind a ChatWaifu-owned SmallWebRTC adapter
      - Browser getUserMedia provides device selection, input meter, echo cancellation, and one audio peer
      - Browser push-to-talk is the safe default capture gate; continuous open mic is an explicit warned opt-in
      - Silero VAD emits typed speech lifecycle events and bounds utterance buffering with pre-roll
      - Remote Runtime TTS is generation-gated and delivered through the WebRTC audio track
      - Real aiortc validation received non-silent remote audio after a local microphone-equivalent input
  - id: 6
    name: cascade-vertical-slice
    status: basic_real_stt_slice_implemented_pending_long_run
    evidence:
      - Final STT text enters the same conversation command as typed text with preallocated turn identity
      - Browser speech state covers listening, transcribing, thinking, and final committed messages
      - Local STT, configured LLM, local TTS, AvatarCue, event store, and WebRTC audio run end to end
  - id: 7
    name: interruption-and-generation-semantics
    status: core_invalidation_implemented_playback_ack_pending
    evidence:
      - Speech start pushes Pipecat interruption before cancelling the active conversation generation
      - STT jobs and Runtime generations carry session, turn, and generation identity
      - Superseded STT results and stale Runtime audio are rejected before playback
      - Two-utterance real audio validation cancelled the first generation and completed only the second
  - id: 8
    name: isolated-model-workers
    status: stt_and_dual_neural_tts_worker_slices_implemented_other_workers_pending
    evidence:
      - Versioned model-worker SDK defines authenticated STT/TTS request, result, health, and identity contracts
      - faster-whisper 1.2.1 runs in its own locked environment and loopback-authenticated process
      - sherpa-onnx Kokoro v1.1 runs in its own locked environment and loopback-authenticated process
      - One authenticated worker protocol covers Qwen3-TTS MLX and GPT-SoVITS CPUFast capabilities, synthesis, cancellation, and unload
      - make demo provisions ephemeral tokens, selects free ports, supervises STT plus both lazy TTS workers, and reuses model caches
      - Public multilingual base model completed a real Chinese transcription on macOS arm64 CPU int8
      - Public Kokoro model completed real Chinese 24 kHz synthesis on macOS arm64 CPU
      - Qwen3-TTS 0.6B Base completed real Chinese and Japanese MLX synthesis on Apple Silicon
      - GPT-SoVITS Roxy v2ProPlus completed real Chinese and Japanese CPUFast synthesis as a local integration model
  - id: 9
    name: real-cascade-models
    status: real_llm_and_selectable_character_tts_demo_implemented_pending_voice_asset
    evidence:
      - OpenAI-compatible adapter receives character prompt, allowed memory context, recent committed dialogue, and current turn
      - Default character is an explicitly labeled unofficial Ayachi Nene themed profile with short visual-novel conversation rules
      - Character voice manifest defaults to the provider-neutral local reference-clone profile without claiming original voice-actor identity
      - A real two-turn dialogue recalled the preceding invitation to sit down and rest
      - Three generation-scoped Kokoro WAV segments were emitted for one real model response
      - Web exposes session-scoped Qwen/GPT-SoVITS selection and Runtime cancels before rerouting
      - Qwen and GPT-SoVITS remain local-only evaluation paths until a licensed Ningning voice dataset/model is supplied
      - A deterministic local-only Nene Qwen3-TTS Colab bundle builder audits audio and text, keeps scene splits stable, pins upstream training code, and defaults to an experimental 0.6B SDPA 200-step pilot with fixed Japanese/Chinese evaluation prompts
      - The 0.6B pilot checkpoint converts to an 8-bit MLX CustomVoice model with the fixed ayachi_nene_local speaker and completes real Chinese/Japanese synthesis on Apple Silicon
  - id: 10
    name: runtime-skills-and-plugins
    status: basic_permissioned_mcp_slice_implemented_pending_os_sandbox
    evidence:
      - SKILL.md and chatwaifu.yaml discovery validates ids, versions, schemas, paths, and duplicates
      - SQLite persists plugins, runs, permission requests, grants, and audited tool calls
      - Permission grants remain separate from per-invocation side-effect confirmation
      - MCP 2025-11-25 stdio tools run in fresh Python child processes with cleaned environments
      - Input/output schema validation, normalized errors, timeout, cancellation, and restart expiry pass tests
      - Local Echo example covers read, confirmed write, timeout, cancellation, disable, and recoverable uninstall
      - Web control center provides progressive SKILL.md loading, invocation, confirmation, run, and plugin controls
      - Real browser smoke completed MCP echo and denied a pending write without executing it
  - id: 11
    name: structured-memory-kernel
    status: scheme_a_implemented_with_b_c_ports_pending_longmem_eval
    evidence:
      - SQLite WAL stores typed records, sources, proposals, lifecycle states, pinned state, and an FTS5 projection
      - Explicit normal writes commit immediately; implicit candidates require review; sensitive candidates always require confirmation
      - Deterministic extraction, exact dedupe, subject-predicate conflict detection, supersede, and provenance are covered by tests
      - Retrieval applies namespace, state, sensitivity, lexical, importance, confidence, and token-budget policy before prompt injection
      - The Web memory center reviews proposals and exposes filters, sources, correction, pinning, and auditable forgetting
      - SemanticMemoryIndex and TemporalMemoryGraph ports reserve optional Scheme B and C candidate inputs without changing SQLite truth ownership

