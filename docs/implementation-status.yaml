phases:
  - id: 0
    name: repository-foundation
    status: implemented_pending_ci
    evidence:
      - Python, TypeScript, and Rust lockfiles exist
      - Six GitHub Actions workflows are configured
      - Sixteen ADRs exist; ADR 0014 supersedes the default-TTS decision in ADR 0012
      - Seven project Codex Development Skills pass quick validation
      - Local bootstrap, lint, typecheck, test, and build gates pass
  - id: 1
    name: protocol-and-code-generation
    status: implemented_pending_ci
    evidence:
      - Pydantic protocol source covers all required Phase 1 model families
      - 31 versioned JSON Schemas are generated deterministically
      - Generated TypeScript declarations and Zod runtime parsers are present
      - 13 Python tests and 8 TypeScript contract tests pass
      - Python-to-TypeScript and TypeScript-to-Python golden fixtures pass
      - Unknown major versions, unknown types, and invalid payloads are rejected
      - Same-major optional fields are accepted
      - The Python-owned generic event catalog is generated as a golden fixture and exhaustively parsed by TypeScript contract tests
      - Audio control headers round-trip as bounded UTF-8 bytes
  - id: 2
    name: live2d-avatar-lab
    status: implemented_real_local_path_pending_remote_ci
    evidence:
      - AvatarCue is reduced through a bounded layered scheduler into an AvatarRenderer
      - AvatarController owns the requestAnimationFrame loop outside React state
      - FakeAvatarRenderer supports semantic state, expression, gesture, gaze, lipsync, and hit tests
      - 21 Avatar SDK tests cover scheduling, deterministic procedural behavior, lifecycle, bridge mapping, fallback, and missing Core
      - Semantic idle, listening, thinking, speaking, and interrupted modes drive normalized micro-motion through per-channel springs
      - The Live2D bridge maps renderer-neutral channels to model-local parameters with explicit set, add, or multiply blending
      - 50 consecutive Fake renderer load and unload cycles leave zero resources
      - 8 Chromium Playwright scenarios cover cues, vendor failure, visual-novel backlog and narrow layouts, desktop-pet interaction UI, desktop settings, real Avatar Lab, and real main chat
      - Official Cubism Web Framework 5-r.5 is pinned and fetched idempotently
      - The local-only Ayachi Nene model loads through the generated bridge with semantic facial presets and bounded action motions
      - Main chat selects real Live2D and safely remounts Fake when vendor loading fails
      - Desktop chat presents a fixed visual-novel stage with selectable upper-body or full-body framing while only the optional backlog scrolls
      - Skills and memory dialogs escape the visual-novel menu stacking context through a page-level modal portal, while their content scroll stays contained
      - Production Web build succeeds without Runtime, Tauri, Pipecat, or proprietary vendor files
  - id: 3
    name: tauri-desktop-host
    status: desktop_pet_vertical_slice_implemented_pending_sidecar_and_packaging
    evidence:
      - Tauri 2.11 owns only OS windows, tray, capabilities, and desktop preferences while React owns Live2D and conversation presentation
      - A transparent undecorated always-on-top avatar overlay shares the existing semantic Avatar and Runtime path
      - The normal control-center window is created lazily and closing it hides rather than terminates the desktop pet
      - The control-center renders a dedicated four-section desktop settings surface instead of reusing the visual-novel conversation page
      - One media-owner policy keeps TTS playback and microphone capture in the pet window so the control center cannot duplicate audio
      - Tray actions show or hide the avatar, open desktop settings, recover mouse click-through, and quit cleanly
      - Overlay position, size, visibility, always-on-top, click-through, subtitle visibility, and online-state visibility persist atomically in the OS application config directory
      - Tauri broadcasts persisted preference changes so the settings window and active overlay remain synchronized
      - Settings navigation, generated application assets, and the title-free macOS template tray icon share a local moon-and-spark visual identity
      - The overlay interaction rail stays hidden at rest, reveals on pointer or keyboard interaction, and keeps its compact typed-message composer available for drafts, sends, HUD, and push-to-talk
      - make desktop supervises workers, Runtime, Web, and Tauri and tears down the complete process group on termination
      - Local macOS smoke confirmed transparent composition and real Ayachi Nene Live2D rendering
  - id: 4
    name: runtime-core
    status: basic_demo_implemented_pending_remote_ci
    evidence:
      - FastAPI loopback Runtime exposes health, session, event, audio, character, memory, and skill APIs
      - SQLite WAL migrations persist sessions, turns, generations, outbox events, memory, and FTS5
      - Demo and OpenAI-compatible LLM providers share a cancellation-aware streaming contract
      - Session-scoped TtsRouter selects normalized Qwen or GPT-SoVITS workers while macOS say and fake remain test/fallback paths
      - Browser WebSocket renders lossless text deltas, queues generation-scoped audio, and applies AvatarCue
      - Audio-element playback promotes a hanging user-gesture probe as soon as real TTS arrives so WKWebView cannot leave active-generation segments queued forever
      - A bounded adaptive Web projector smooths network/provider text bursts without delaying Runtime or leaking cancelled-generation text
      - The fixed character greeting is limited to truly empty conversations and is not reused as pending-generation text
      - Interrupt cancels Runtime work and clears stale browser playback and avatar state
      - Runtime persists idempotent segment playback acknowledgements and projects only completely heard sentences into generation spoken_text
      - Structured memory records survive sessions, keep source-event provenance, and forget uses auditable tombstones
      - Confirmed reset cancels generation and clears current turns/events, all memories, and WAV assets
      - Reset keeps the session ready and rejects late output before a fresh sequence starts at one
      - Manifest-driven runtime.status skill reports actual providers with read-only side effect
      - make demo preflights fixed ports before worker creation and cleans Runtime, Web, STT, and TTS process groups after Ctrl+C, SIGTERM, or SIGHUP
  - id: 5
    name: pipecat-realtime-transport
    status: local_reconnect_and_playout_ack_implemented_pending_public_network_hardening
    evidence:
      - Pipecat 1.7 is pinned behind a ChatWaifu-owned SmallWebRTC adapter
      - Browser getUserMedia provides device selection, input meter, echo cancellation, and one audio peer
      - Browser push-to-talk is the safe default capture gate; continuous open mic is an explicit warned opt-in
      - Silero VAD emits typed speech lifecycle events and bounds utterance buffering with pre-roll
      - Remote Runtime TTS is generation-gated and delivered through the WebRTC audio track
      - Ordered WebRTC data-channel markers bind each remote segment to the browser output-media clock
      - Track loss, device changes, failed peers, and transient disconnects enter bounded automatic recovery with microphone fallback
      - Real aiortc validation received non-silent remote audio after a local microphone-equivalent input
      - A live browser peer automatically recovered after Runtime restart and reopened its ordered data channel
  - id: 6
    name: cascade-vertical-slice
    status: basic_real_stt_slice_implemented_pending_long_run
