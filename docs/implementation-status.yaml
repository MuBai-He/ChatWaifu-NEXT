    status: real_llm_and_selectable_character_tts_demo_implemented_pending_voice_asset
    evidence:
      - OpenAI-compatible adapter receives character prompt, allowed memory context, recent committed dialogue, and current turn
      - Default character is an explicitly labeled unofficial Ayachi Nene themed profile with short visual-novel conversation rules
      - Character voice manifest defaults to the provider-neutral local reference-clone profile without claiming original voice-actor identity
      - A real two-turn dialogue recalled the preceding invitation to sit down and rest
