phases:
  - id: 0
    name: repository-foundation
    status: implemented_pending_ci
    evidence:
      - Python, TypeScript, and Rust lockfiles exist
      - Nine GitHub Actions workflows are configured, including independent Web and Desktop tag gates plus a documentation build and dependency-audit gate
      - A VitePress installation and extension site builds locally and is publicly served from an audited static Pages mirror while the canonical product source remains private
      - Thirty ADRs exist; ADR 0014 supersedes the default-TTS decision in ADR 0012, ADR 0026 defines product release profiles, ADR 0027 fixes the Windows installed-resource and user-data boundary, ADR 0028 defines versioned local AI Worker Packs, ADR 0029 fixes a provider-neutral external channel boundary, and ADR 0030 selects the Runtime-native WeChat iLink adapter
      - Seven project Codex Development Skills pass quick validation
      - Local bootstrap, lint, typecheck, test, and build gates pass
  - id: 1
    name: protocol-and-code-generation
    status: implemented_pending_ci
    evidence:
      - Pydantic protocol source covers all required Phase 1 model families
      - 51 versioned JSON Schemas are generated deterministically
      - Generated TypeScript declarations and Zod runtime parsers are present
      - 22 Python tests and 18 TypeScript contract tests pass
      - Python-to-TypeScript and TypeScript-to-Python golden fixtures pass
      - Unknown major versions, unknown types, and invalid payloads are rejected
      - Same-major optional fields are accepted
      - The Python-owned generic event catalog is generated as a golden fixture and exhaustively parsed by TypeScript contract tests
      - Audio control headers round-trip as bounded UTF-8 bytes
  - id: 2
    name: live2d-avatar-lab
    status: implemented_real_local_path_pending_remote_ci
    evidence:
      - AvatarCue is reduced through a bounded layered scheduler into an AvatarRenderer
      - AvatarController owns the requestAnimationFrame loop outside React state
      - FakeAvatarRenderer supports semantic state, expression, gesture, gaze, lipsync, and hit tests
      - 21 Avatar SDK tests cover scheduling, deterministic procedural behavior, lifecycle, bridge mapping, fallback, and missing Core
      - Semantic idle, listening, thinking, speaking, and interrupted modes drive normalized micro-motion through per-channel springs
      - The Live2D bridge maps renderer-neutral channels to model-local parameters with explicit set, add, or multiply blending
      - Live2D interaction preserves authored head/body semantics and falls back to visible drawable mesh triangles for omitted hair, limbs, and clothing without turning transparent canvas into a hit area
      - 50 consecutive Fake renderer load and unload cycles leave zero resources
      - 8 Chromium Playwright scenarios cover cues, vendor failure, visual-novel backlog and narrow layouts, desktop-pet interaction UI, desktop settings, real Avatar Lab, and real main chat
      - Official Cubism Web Framework 5-r.5 is pinned and fetched idempotently
      - The local-only Ayachi Nene model loads through the generated bridge with semantic facial presets and bounded action motions
      - Main chat selects real Live2D and safely remounts Fake when vendor loading fails
      - Desktop chat presents a fixed visual-novel stage with selectable upper-body or full-body framing while only the optional backlog scrolls
      - Skills and memory dialogs escape the visual-novel menu stacking context through a page-level modal portal, while their content scroll stays contained
      - The compile-time Web product graph owns only conversation and Avatar Lab and emits apps/web/dist/web with a verified module manifest
      - Production Web build succeeds without Runtime, Tauri, Pipecat, desktop-pet/settings modules, or proprietary vendor files
  - id: 3
    name: tauri-desktop-host
    status: native_windows_x64_owner_only_install_reinstall_and_foreground_ui_passed_human_gates_open
    evidence:
      - Tauri 2.11 owns only OS windows, tray, capabilities, and desktop preferences while React owns Live2D and conversation presentation
      - The compile-time Desktop product graph owns only desktop-pet and control-center surfaces, emits apps/web/dist/desktop, and is the only frontend Tauri consumes
      - Web and Desktop have independent 0.2.0 release trains and exact web-v*/desktop-v* tag validation while sharing one main branch
      - A transparent undecorated always-on-top avatar overlay shares the existing semantic Avatar and Runtime path
      - The normal control-center window is created lazily and closing it hides rather than terminates the desktop pet
      - The control-center renders a dedicated six-section desktop settings surface instead of reusing the visual-novel conversation page
      - A typed desktop settings registry is the single navigation/composition entry; existing sections use shared layout, write-only secret, and mutually-exclusive async-operation primitives with platform visibility and availability hooks
      - The native host injects an explicit control-center surface marker before frontend scripts; development URLs carry the same marker, while immutable labels and paths remain fallbacks, preventing stale Windows WebView context from mounting the desktop-pet page in settings
      - Focused desktop settings temporarily promote the control center and demote the always-on-top avatar, restoring both normal settings z-order and the persisted avatar preference on blur or close
      - One media-owner policy keeps TTS playback and microphone capture in the pet window so the control center cannot duplicate audio
      - The macOS host embeds a microphone usage description and unsupported WebViews expose an actionable recovery message instead of an inert disabled control
      - Tray actions show or hide the avatar, open desktop settings, recover mouse click-through, and quit cleanly
      - Overlay position, size, visibility, always-on-top, click-through, and subtitle visibility persist atomically in the OS application config directory
      - Tauri broadcasts persisted preference changes so the settings window and active overlay remain synchronized
      - Web, desktop-pet, and control-center functional icons share the typed Lucide SVG boundary while favicon, generated application assets, settings branding, and the tray use the existing Web crescent-and-ribbon mark
      - The overlay interaction rail stays hidden at rest, reveals on pointer or keyboard interaction, and keeps its compact typed-message composer available for drafts, sends, HUD, and push-to-talk
      - The compact HUD owns only subtitle visibility; the former online label and decorative drag strip are removed, while pressing and moving any authored or visible-mesh avatar hit starts native window dragging synchronously without converting the gesture into a touch
      - The inactive overlay uses bounded global physical-cursor tracking to reveal controls without focus while transparent points keep passing through; only Live2D mesh hits, marked UI chrome, modal guards, avatar gestures, and push-to-talk request temporary native capture
      - The avatar overlay disables inactive WebView throttling so streaming text, audio progress, Live2D, and subtitle paging continue without mouse focus or selection
      - Desktop-pet pending replies show only the typing caret; compact subtitles fold paragraph gaps, retain all text in a bounded three-line viewport, and turn forward in whole-line steps from actual audio-element or WebRTC playback progress instead of token arrival
      - make desktop supervises workers, Runtime, Web, and Tauri and tears down the complete process group on termination
      - Tauri starts the local service stack on dynamic ports and accepts only a versioned prefix-delimited secret-free bootstrap handshake
      - Unexpected Runtime-stack exits use bounded exponential restart backoff, open a circuit after five failures, and expose manual recovery in settings and tray
      - Rust shutdown terminates and waits for the owned service child so ordinary desktop exit leaves no orphan Runtime or workers
      - The service stack watches its owning Rust PID and self-cleans after abrupt development hot reloads that bypass normal Tauri exit events
      - Local macOS smoke confirmed transparent composition and real Ayachi Nene Live2D rendering
      - Apple Silicon owner packaging freezes the base Runtime into the Tauri resource root, emits unsigned app, DMG, portable app zip, and SHA-256 artifacts, rejects local neural model packs and weights, then passes embedded Runtime plus complete Host lifecycle smoke
      - Windows x64 development launcher keeps Vite hot reload and Rust logs attached while preserving the x86_64-pc-windows-msvc target on Windows-on-ARM
      - Windows development without local model assets degrades to a healthy dynamic-port Demo Runtime with fake TTS and disabled STT; cloud TTS remains discoverable and Ctrl+C leaves no Runtime listener
      - Windows parent-watchdog liveness checks use a non-signaling process handle instead of POSIX kill-zero semantics; a real x64 development smoke remains alive through Runtime readiness and cleans host plus listeners on intentional Ctrl+C
      - A real Windows x64 Tauri smoke renders the local Ayachi Nene Live2D model transparently after the launcher bounds the ignored 8192px source texture to a preserved 4096px runtime copy
      - ADR 0027 fixes NSIS current-user delivery, a PyInstaller onedir Runtime under the Tauri resource root, immutable-resource versus per-user-data ownership, retained data on uninstall, and the exclusion of CUDA weights and private Live2D/voice assets from the redistributable base
      - A Windows-only packaging slice defines frozen-Runtime collection and smoke, x64 PE checks, fixed Runtime/helper resource staging, NSIS assembly, and a private explicit Live2D overlay
      - On 2026-08-30 an unsigned owner-only private-overlay candidate passed a real current-user install on a Windows 11 ARM VM under x64 emulation, covering registry and Start Menu layout, Host/Runtime/helper PE 0x8664, Runtime identity and dynamic-port health, Tauri user roots plus SQLite, forced-host Runtime/listener cleanup, uninstall removal of immutable resources, and byte-identical config/data marker retention
      - That 2026-08-30 Windows-on-ARM result remains historical basic-smoke evidence and is not used as proof of native Windows x64/CUDA behavior
      - On 2026-09-01 the owner-only NSIS candidate installed without elevation on native Windows 11 AMD64; Host, Frozen Runtime, AppContainer helper, and enumerated native pack binaries were PE 0x8664, and Runtime plus both workers reached healthy state on dynamic loopback ports
      - Automated native acceptance covered installed layout and Start Menu identity, pack receipt and selection, forced-exit process-tree and listener cleanup, and reinstall retention of settings, SQLite data, packs, and selection
      - A hard Host kill left only two exact crash-owned worker-cache launch directories; the next Runtime boot reclaimed both through per-launch OS-lock leases without deleting any active or unverifiable cache namespace
      - Computer Use observed the native development overlay render and animate the private Live2D model with transparent empty-point click-through, retained avatar/control interaction and native dragging, and a correctly laid out independently scrolling settings window
      - Computer Use observed the installed shortcut launch the real pet and control center, Runtime and both selected workers reach ready, text/model/memory flows operate, and the private memory marker remain present after reinstall and restart
      - Connecting the microphone during an installed WAV generation exposed a dropped tail segment with no playback ACK; the frontend now defers WebRTC ownership until the next generation, with a regression covering tail completion and exclusive next-generation remote playback
      - Application exit no longer persists the avatar as hidden; moved and resized state still persists, and a Rust regression test covers application exit separately from an explicit visibility change
      - The Web desktop Runtime resolution budget remains 455 seconds for the native host's bounded model readiness; tests cover delayed CUDA-ready and ready-before-listener-registration paths, while ordinary startup no longer repeats the historical approximately 443-second complete-pack scan and the full audit is an explicit Data-settings operation
      - Windows bin/lib targets now use distinct artifact names, removing the Cargo PDB collision while preserving the packaged executable identity
      - The NSIS post-uninstall hook removes only stale manufacturer install metadata during a real uninstall and preserves all AppData; smoke gates now cover both registry views and both Start Menu/Desktop shortcuts
      - The rebuilt owner-only installer containing the hook passed a native install/health/forced-exit/uninstall replay; its product tree, shortcuts, uninstall entries, and manufacturer metadata were gone afterward while settings/data roots, selection, and both Worker Packs remained
      - The final Tauri Host uses the official single-instance plugin first in the builder chain; a real repeated Start Menu launch reactivated the existing avatar without creating a second Runtime graph
      - One installed microphone utterance completed VAD and faster-whisper return, but recognition quality was poor; playback-time voice barge-in remains unproved because the user did not speak during the final attempt. Installed empty-point click-through, human audio comparison, normal tray-menu exit, installed AppContainer/MCP reconciliation, asset/license review, signing, and remote publication remain pending
