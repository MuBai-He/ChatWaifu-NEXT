[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatwaifu-asr-faster-whisper-worker"
version = "0.1.0"
description = "Isolated faster-whisper ASR worker for ChatWaifu NEXT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "av>=11,<19",
  "chatwaifu-model-worker-sdk",
  "fastapi>=0.116,<1",
  "faster-whisper==1.2.1",
  "numpy>=2,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
chatwaifu-asr-worker = "chatwaifu_asr_worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/chatwaifu_asr_worker"]

[tool.uv.sources]
chatwaifu-model-worker-sdk = { path = "../../packages/model-worker-sdk-python" }

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
