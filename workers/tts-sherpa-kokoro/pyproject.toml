[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatwaifu-tts-sherpa-kokoro-worker"
version = "0.1.0"
description = "Isolated sherpa-onnx Kokoro TTS worker for ChatWaifu NEXT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "chatwaifu-model-worker-sdk",
  "fastapi>=0.116,<1",
  "numpy>=2,<3",
  "pydantic-settings>=2.10,<3",
  "sherpa-onnx==1.13.6",
  # uv locks from the index metadata, while the platform wheel declares this
  # runtime payload only inside its own METADATA. Keep it explicit so macOS
  # receives libonnxruntime.dylib and the sherpa C API libraries.
  "sherpa-onnx-core==1.13.6",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
chatwaifu-tts-worker = "chatwaifu_tts_worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/chatwaifu_tts_worker"]

[tool.uv.sources]
chatwaifu-model-worker-sdk = { path = "../../packages/model-worker-sdk-python" }

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../../packages/model-worker-sdk-python/src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
