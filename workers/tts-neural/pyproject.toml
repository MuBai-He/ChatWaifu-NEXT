[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatwaifu-tts-neural-worker"
version = "0.1.0"
description = "Unified isolated neural TTS worker for ChatWaifu NEXT"
requires-python = ">=3.10,<3.14"
dependencies = [
  "chatwaifu-model-worker-sdk",
  "fastapi>=0.116,<1",
  "numpy>=1.24,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
chatwaifu-neural-tts-worker = "chatwaifu_tts_neural_worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/chatwaifu_tts_neural_worker"]

[tool.uv.sources]
chatwaifu-model-worker-sdk = { path = "../../packages/model-worker-sdk-python" }

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../../packages/model-worker-sdk-python/src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../../packages/model-worker-sdk-python/src"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["chatwaifu_tts_neural_worker"]
