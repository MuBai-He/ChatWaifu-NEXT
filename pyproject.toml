[project]
name = "chatwaifu-next-workspace"
version = "0.1.0"
description = "ChatWaifu NEXT monorepo tooling"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/model-worker-sdk-python",
  "packages/protocol-python",
  "services/runtime",
]
exclude = ["workers/asr-faster-whisper", "workers/tts-sherpa-kokoro"]

[dependency-groups]
dev = [
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
packaging = [
  "pyinstaller==6.22.2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = [
  ".",
  "packages/model-worker-sdk-python/src",
  "packages/protocol-python/src",
  "services/runtime/src",
]
testpaths = [
  "packages/model-worker-sdk-python/tests",
  "packages/protocol-python/tests",
  "services/runtime/tests",
  "tests/contract",
  "tools/tests",
]

[tool.pyright]
include = [
  "packages/model-worker-sdk-python/src",
  "packages/model-worker-sdk-python/tests",
  "packages/protocol-python/src",
  "packages/protocol-python/tests",
  "services/runtime/src",
  "services/runtime/tests",
  "tools",
]
exclude = [
  "tools/qwen3_tts_training/bundle_assets",
]
extraPaths = [
  "packages/model-worker-sdk-python/src",
  "packages/protocol-python/src",
  "services/runtime/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".local",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
allowed-confusables = ["，", "！", "？"]
