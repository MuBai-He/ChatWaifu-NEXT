[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatwaifu-protocol"
version = "0.1.0"
description = "Versioned domain contracts for ChatWaifu NEXT"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.11,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/chatwaifu_protocol"]
