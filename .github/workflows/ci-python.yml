name: Windows integration diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --all-groups --locked
      - run: uv run pytest -vv --tb=short --durations=25 --junitxml=pytest-results.xml -o faulthandler_timeout=120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-complete-diagnostics
          path: pytest-results.xml
          retention-days: 7
