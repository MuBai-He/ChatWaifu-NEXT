name: Protocol Contract CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-contract.yml"
      - "packages/protocol-python/**"
      - "packages/protocol-typescript/**"
      - "schemas/domain/v1/**"
      - "tests/contract/**"
      - "tests/fixtures/protocol/**"
      - "tools/generate_protocol_schemas.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - ".github/workflows/ci-contract.yml"
      - "packages/protocol-python/**"
      - "packages/protocol-typescript/**"
      - "schemas/domain/v1/**"
      - "tests/contract/**"
      - "tests/fixtures/protocol/**"
      - "tools/generate_protocol_schemas.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: uv sync --all-packages --all-groups --locked
      - run: pnpm install --frozen-lockfile
      - run: make generate-protocol
      - run: git diff --exit-code -- schemas/domain/v1 packages/protocol-typescript/src/generated tests/fixtures/protocol/v1
      - run: make test-contract
