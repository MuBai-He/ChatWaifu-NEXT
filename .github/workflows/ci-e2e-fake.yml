name: Phase 2 Avatar Lab Smoke

on:
  push:
  pull_request:

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chatwaifu/web exec playwright install --with-deps chromium
      - run: make test-e2e

  phase-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject dependencies outside the Phase 2 boundary
        shell: bash
        run: |
          if rg -n 'pipecat|webrtc|kafka|postgres|redis|openai|anthropic|gemini' --glob 'package.json' --glob 'pyproject.toml' --glob 'Cargo.toml'; then
            echo 'A dependency from a later phase was introduced.'
            exit 1
          fi
