name: Web E2E and Architecture Boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chatwaifu/web exec playwright install --with-deps chromium
      # The browser smoke is a Node-only gate. Override Make's local uv-backed
      # pnpm wrapper so a missing Python environment cannot break this job.
      - run: make test-e2e PNPM=pnpm

  architecture-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/check_architecture_boundaries.py
