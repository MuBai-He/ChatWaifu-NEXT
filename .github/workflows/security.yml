name: Security CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: uv sync --all-packages --all-groups --locked
      - run: pnpm install --frozen-lockfile
      # PYSEC-2026-3740: NLTK regex/grammar parser issue. ChatWaifu only consumes
      # pre-bundled Punkt sentence tokenization (nltk.sent_tokenize), so untrusted
      # grammar parsing is unreachable. Review/expiry: 2026-10-31 (tracking upstream 3.10.4 release).
      - run: uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2026-3740
      - run: pnpm audit --audit-level high
