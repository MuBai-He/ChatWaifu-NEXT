name: Desktop Product CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-rust.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "services/runtime/**"
      - "packages/model-worker-sdk-python/**"
      - "packages/protocol-python/**"
      - "packages/protocol-typescript/**"
      - "packages/avatar-sdk/**"
      - "workers/**"
      - "characters/**"
      - "config/**"
      - "skills/**"
      - "schemas/**"
      - "tools/run_desktop_services.py"
      - "tools/run_runtime.py"
      - "tools/product_release.py"
      - "tools/verify_product_artifacts.py"
      - "tools/windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "release/products.json"
  pull_request:
    paths:
      - ".github/workflows/ci-rust.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "services/runtime/**"
      - "packages/model-worker-sdk-python/**"
      - "packages/protocol-python/**"
      - "packages/protocol-typescript/**"
      - "packages/avatar-sdk/**"
      - "workers/**"
      - "characters/**"
      - "config/**"
      - "skills/**"
      - "schemas/**"
      - "tools/run_desktop_services.py"
      - "tools/run_runtime.py"
      - "tools/product_release.py"
      - "tools/verify_product_artifacts.py"
      - "tools/windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "release/products.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: uv sync --all-packages --all-groups --locked
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify Desktop release contract
        run: uv run python tools/product_release.py verify --product desktop
      - name: Build Runtime sidecar component wheel
        run: uv build --package chatwaifu-runtime --wheel --clear --out-dir dist/runtime-sidecar
      # Exercise Tauri's real build graph, including beforeBuildCommand,
      # frontendDist, resources, capabilities, and native startup metadata.
      - name: Build unsigned Tauri host
        if: runner.os != 'Windows'
        run: pnpm --filter @chatwaifu/desktop build
      - name: Build unsigned Windows x64 Tauri host
        if: runner.os == 'Windows'
        run: pnpm --filter @chatwaifu/desktop build:windows-x64
      - name: Verify isolated Desktop frontend artifact
        run: uv run python tools/verify_product_artifacts.py --product desktop
