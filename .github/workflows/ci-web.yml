name: Web CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Native Tauri compilation belongs to Rust CI. Keep this gate focused on
      # the three browser-consumed TypeScript packages.
      - run: pnpm --filter @chatwaifu/protocol build
      - run: pnpm --filter @chatwaifu/avatar-sdk build
      - run: pnpm --filter @chatwaifu/web build
