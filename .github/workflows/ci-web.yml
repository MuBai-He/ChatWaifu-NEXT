name: Web Product CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-web.yml"
      - "apps/web/**"
      - "packages/avatar-sdk/**"
      - "packages/protocol-typescript/**"
      - "schemas/domain/v1/**"
      - "tools/live2d_bridge/**"
      - "tools/product_release.py"
      - "tools/verify_product_artifacts.py"
      - "release/products.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/ci-web.yml"
      - "apps/web/**"
      - "packages/avatar-sdk/**"
      - "packages/protocol-typescript/**"
      - "schemas/domain/v1/**"
      - "tools/live2d_bridge/**"
      - "tools/product_release.py"
      - "tools/verify_product_artifacts.py"
      - "release/products.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "31 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check apps/web packages/avatar-sdk packages/protocol-typescript release/products.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python tools/product_release.py verify --product web
      - run: pnpm --filter @chatwaifu/web build:web
      - run: python tools/verify_product_artifacts.py --product web
      - name: Build and verify Desktop UI without a native host build
        run: |
          pnpm --filter @chatwaifu/web build:desktop
          python tools/verify_product_artifacts.py --product desktop
