packages:
  - apps/*
  - docs-site
  - packages/*
allowBuilds:
  # VitePress 1.x bundles with Vite 5, whose pinned esbuild package verifies the
  # platform binary in its install script. Keep every other dependency denied
  # unless it is reviewed and added here explicitly.
  esbuild: true
overrides:
  # VitePress 1.6 pins Vite 5, which is affected by GHSA-fx2h-pf6j-xcff.
  # Plugin Vue 5 supports Vite 6; keep the docs graph on the first patched line.
  "vitepress@1.6.4>vite": 6.4.3
  "@vitejs/plugin-vue@5.2.4>vite": 6.4.3
