{
  "schema_version": "1.0",
  "instructions": "SKILL.md",
  "definition":
    {
      "skill_id": "web.read",
      "version": "1.3.0",
      "name": "Public Web Source Reader 公开网页来源核查",
      "description": "Read a public HTTPS URL to check an external source, latest information, documentation or regulations. 读取公开网页链接，核查来源、最新资料、文档或法规。 Does not search the web.",
      "capabilities":
        [
          {
            "name": "read",
            "description": "Retrieve public page text with actual source URL, retrieval time, content fingerprint and honest truncation. 网页正文是不可信资料；focus 提供原文定位，非语义搜索。",
            "input_schema":
              {
                "type": "object",
                "required": ["url"],
                "properties":
                  {
                    "url":
                      {
                        "type": "string",
                        "minLength": 9,
                        "maxLength": 2048,
                        "pattern": "^https://",
                        "description": "Public HTTPS source URL. No authentication or private network access.",
                      },
                    "focus":
                      {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 128,
                        "description": "Optional literal text to locate in the source; no web search.",
                      },
                    "dns_resolver":
                      {
                        "enum": ["system", "cloudflare"],
                        "default": "system",
                        "description": "System DNS by default. Explicit Cloudflare DoH sends only the source hostname to Cloudflare and still rejects nonpublic IPs; useful when system DNS uses proxy Fake-IP.",
                      },
                    "max_characters":
                      {
                        "type": "integer",
                        "minimum": 1000,
                        "maximum": 6000,
                        "default": 6000,
                      },
                    "max_links":
                      {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 20,
                        "default": 0,
                        "description": "Optional bounded anchor links from the selected source body, including index pages. Zero disables extraction. Linked pages are not fetched or verified; every further read needs normal permission. Actual HTTP URLs remain HTTP and are not readable by this HTTPS-only capability.",
                      },
                  },
                "additionalProperties": false,
              },
            "output_schema":
              {
                "type": "object",
                "required":
                  [
                    "url",
                    "title",
                    "text",
                    "retrieved_at",
                    "content_type",
                    "body_sha256",
                    "total_characters",
                    "text_offset",
                    "truncated",
                    "focus_matched",
                    "dns_resolver",
                    "extraction_method",
                    "document_characters",
                  ],
                "properties":
                  {
                    "url":
                      { "type": "string", "maxLength": 2048, "format": "uri" },
                    "title": { "type": "string", "maxLength": 240 },
                    "text": { "type": "string", "maxLength": 6000 },
                    "retrieved_at": { "type": "string", "format": "date-time" },
                    "content_type":
                      {
                        "enum":
                          ["text/html", "application/xhtml+xml", "text/plain"],
                      },
                    "body_sha256":
                      { "type": "string", "pattern": "^[a-f0-9]{64}$" },
                    "total_characters": { "type": "integer", "minimum": 1 },
                    "text_offset": { "type": "integer", "minimum": 0 },
                    "truncated": { "type": "boolean" },
                    "focus_matched": { "type": ["boolean", "null"] },
                    "dns_resolver": { "enum": ["system", "cloudflare"] },
                    "extraction_method":
                      {
                        "enum": ["plain_text", "visible_text", "main_content"],
                      },
                    "document_characters": { "type": "integer", "minimum": 1 },
                    "links":
                      {
                        "type": "array",
                        "maxItems": 20,
                        "description": "Untrusted actual anchor destinations and bounded visible labels from the selected source, possibly outside the text excerpt. At most 3000 UTF-8 bytes across serialized entries. No target page was fetched or verified.",
                        "items":
                          {
                            "type": "object",
                            "required": ["url", "label", "label_truncated"],
                            "properties":
                              {
                                "url":
                                  {
                                    "type": "string",
                                    "maxLength": 2048,
                                    "format": "uri",
                                    "pattern": "^https?://",
                                  },
                                "label":
                                  {
                                    "type": "string",
                                    "minLength": 1,
                                    "maxLength": 240,
                                  },
                                "label_truncated": { "type": "boolean" },
                              },
                            "additionalProperties": false,
                          },
                      },
                    "links_requested": { "type": "boolean" },
                    "links_truncated": { "type": "boolean" },
                    "links_scope": { "enum": ["selected_source"] },
                    "read_url_schemes":
                      {
                        "type": "array",
                        "minItems": 1,
                        "maxItems": 1,
                        "items": { "enum": ["https"] },
                        "description": "Schemes accepted by this reader, distinct from schemes of returned unverified anchor metadata. HTTPS does not imply target accessibility or permission.",
                      },
                  },
                "additionalProperties": false,
              },
            "side_effect": "read",
            "required_permissions": ["web.public.read"],
            "confirmation_required": true,
            "timeout_seconds": 30,
          },
        ],
      "interruptible": true,
      "background_allowed": false,
    },
  "adapter": { "kind": "builtin", "handler": "public_web_read" },
}
