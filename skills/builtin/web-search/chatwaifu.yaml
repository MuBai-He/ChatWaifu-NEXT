{
  "schema_version": "1.0",
  "instructions": "SKILL.md",
  "definition":
    {
      "skill_id": "web.search",
      "version": "1.3.6",
      "name": "Public Source Search 公开来源搜索",
      "description": "Search public source URLs to verify information, regulations, technical specifications, protocol or algorithm behavior, and API documentation. 搜索公开来源，核查最新资料、法规、技术规范、协议、算法机制与 API 文档；搜索片段须用 web.read 读取原文后核实。",
      "capabilities":
        [
          {
            "name": "search",
                    "description": "Discover actual HTTPS source URLs through the configured provider. DuckDuckGo Lite remains the default; SearXNG is an explicitly configured local discovery service, Firecrawl is an optional external provider, So360 is a keyless Chinese discovery provider, and Jina Sogou is a keyless Chinese provider using Jina's bounded Markdown projection. Query is sent externally after confirmation; challenges and failures are reported honestly. 联网查找来源，片段不是事实证明。",
            "input_schema":
              {
                "type": "object",
                "required": ["query"],
                "properties":
                  {
                    "query":
                      {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 256,
                        "description": "Public topic query sent to the configured search provider. For current rules, search concise topic plus latest changes first, then read official sources. After reading a base rule, search subsequent changes with different wording; do not seed that update query with remembered thresholds or certification conditions. Do not limit initial discovery to one institution or only the current year unless the user requires it. Use trusted Runtime time when a date qualifier is needed. Omit secrets and private user data.",
                      },
                    "domains":
                      {
                        "type": "array",
                        "maxItems": 3,
                        "uniqueItems": true,
                        "items":
                          {
                            "type": "string",
                            "minLength": 3,
                            "maxLength": 253,
                          },
                        "description": "Optional public DNS names used for site queries and filtering actual result hosts. Omit for initial current-update discovery unless the user restricts sources; use to verify original publications after discovery.",
                      },
                    "max_results":
                      {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 5,
                        "default": 5,
                      },
                    "dns_resolver":
                      {
                        "enum": ["system", "cloudflare"],
                        "default": "system",
                        "description": "Explicit Cloudflare DoH sends only the search hostname to Cloudflare; all addresses must remain public.",
                      },
                  },
                "additionalProperties": false,
              },
            "output_schema":
              {
                "type": "object",
                "required":
                  [
                    "provider",
                    "query",
                    "effective_query",
                    "search_url",
                    "retrieved_at",
                    "body_sha256",
                    "dns_resolver",
                    "results",
                    "total_matched",
                    "filtered_count",
                    "truncated",
                    "empty_reason",
                  ],
                "properties":
                  {
                    "provider": { "enum": ["duckduckgo_lite", "firecrawl", "searxng", "so360", "jina_sogou"] },
                    "query": { "type": "string", "maxLength": 256 },
                    "effective_query": { "type": "string", "maxLength": 256 },
                    "provider_queries":
                      {
                        "type": "array",
                        "maxItems": 3,
                        "items":
                          {
                            "type": "object",
                            "required": ["query"],
                            "properties":
                              {
                                "query": { "type": "string", "maxLength": 2048 },
                                "body_sha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
                                "error_code": { "type": "string", "maxLength": 128 },
                              },
                            "oneOf": [{ "required": ["body_sha256"] }, { "required": ["error_code"] }],
                            "additionalProperties": false,
                          },
                      },
                    "search_url":
                      { "type": "string", "maxLength": 2048, "format": "uri" },
                    "retrieved_at": { "type": "string", "format": "date-time" },
                    "body_sha256":
                      { "type": "string", "pattern": "^[a-f0-9]{64}$" },
                    "dns_resolver": { "enum": ["system", "cloudflare"] },
                    "results":
                      {
                        "type": "array",
                        "maxItems": 5,
                        "items":
                          {
                            "type": "object",
                            "required": ["url", "title", "snippet"],
                            "properties":
                              {
                                "url":
                                  {
                                    "type": "string",
                                    "maxLength": 2048,
                                    "format": "uri",
                                  },
                                "title": { "type": "string", "maxLength": 240 },
                                "snippet":
                                  { "type": "string", "maxLength": 480 },
                              },
                            "additionalProperties": false,
                          },
                      },
                    "total_matched": { "type": "integer", "minimum": 0 },
                    "filtered_count": { "type": "integer", "minimum": 0 },
                    "truncated": { "type": "boolean" },
                    "empty_reason":
                      { "enum": ["no_results", "filtered", null] },
                  },
                "additionalProperties": false,
              },
            "side_effect": "read",
            "required_permissions": ["web.public.search"],
            "confirmation_required": true,
            "timeout_seconds": 30,
          },
        ],
      "interruptible": true,
      "background_allowed": false,
    },
  "adapter": { "kind": "builtin", "handler": "public_web_search" },
}
