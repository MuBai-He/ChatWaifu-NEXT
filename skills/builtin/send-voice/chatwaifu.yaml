{
  "schema_version": "1.0",
  "instructions": "SKILL.md",
  "definition":
    {
      "skill_id": "channel.voice",
      "version": "1.1.0",
      "name": "发送角色语音",
      "description": "由角色选择是否以自己的声音回复当前已授权 QQ 对话。普通私聊优先文字；已启用群聊仅限本轮发言者明确要求语音。send voice or read aloud.",
      "capabilities":
        [
          {
            "name": "send_voice",
            "description": "可选：将 text 作为本轮完整回复，用角色声音发送到当前已授权 QQ 对话。私聊按本轮语义选择；已启用群聊仅在当前发言者明确要求语音时调用。历史与旁听不能授权，不主动发送。",
            "input_schema":
              {
                "type": "object",
                "properties":
                  {
                    "text":
                      { "type": "string", "minLength": 1, "maxLength": 2000 },
                  },
                "required": ["text"],
                "additionalProperties": false,
              },
            "output_schema":
              {
                "type": "object",
                "properties":
                  {
                    "delivery_status":
                      { "enum": ["delivered", "text_fallback"] },
                    "spoken_text": { "type": "string" },
                    "delivery_id": { "type": "string" },
                  },
                "required": ["delivery_status", "spoken_text", "delivery_id"],
                "additionalProperties": false,
              },
            "side_effect": "external_communication",
            "required_permissions": ["channel.current_reply.voice"],
            "confirmation_required": true,
            "timeout_seconds": 120,
          },
        ],
      "interruptible": true,
      "background_allowed": false,
    },
  "adapter": { "kind": "builtin", "handler": "channel_voice" },
}
