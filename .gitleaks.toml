title = "ChatWaifu secret scanning"

[extend]
useDefault = true

# Reviewed 2026-10-06 with Gitleaks 8.24.3. Keep all default detection rules.
# Each exception requires both an exact frozen path and a reviewed full match.
# Source checksums were bound to Git blobs; sample_key values are evaluation UUIDs.
# Private review key files remain withheld; only their recorded digests are allowed.
